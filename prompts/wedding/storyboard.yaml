segments:
- id: '01'
  tc:
  - 0
  - 15
  title: 日出・新北大橋
  board:
    picture: 【日出】新北大橋遠景，橋面車流慢速疊化至大漢溪水面反射
    story: 旁白「在兩條河的交會，一座橋讓兩顆心每天相遇。」
    camera: 航拍→輕推進；淡入
    sound: 純鋼琴・溫暖前奏
  shots:
  - id: w01-bridge
    kind: omni
    duration: 15
    refs:
    - kf01
    - style-clay
    use: 0–15 全段；0–2 秒由黑淡入
    zh: 日出航拍新北大橋，車流緩慢；後段鏡頭下搖到大漢溪水面，橋與朝霞的倒影。
    prompt: '[0-9s] Aerial drone shot at sunrise of the long river bridge from the location reference, light traffic moving slowly across it, golden early light and thin mist over the wide river; the drone glides forward and gently descends. [9-15s] The camera tilts down from the bridge deck to the calm river surface, where the bridge, the pink sky and the rising sun are mirrored, soft ripples breaking the reflection. Slow, smooth, one continuous shot.'
    ambient: soft morning wind, distant traffic hum, water lapping
  vo:
  - tc: 3–10
    speaker: 旁白
    text: 在兩條河的交會，一座橋讓兩顆心每天相遇。
    style: warm, calm, unhurried
  music: M1 開始（鋼琴前奏）
  notes:
  - 地理：新北大橋跨的是大漢溪、連接板橋與新莊，並不在永和與三重之間；大漢溪與新店溪的「兩河交會」在華江橋一帶。旁白是象徵用法可以保留，但在地觀眾會注意到。
- id: '02'
  tc:
  - 15
  - 35
  title: 她，永和；他，三重（分割畫面）
  board:
    picture: 左：永和女方準備出門，窗外台北 101。右：三重男方背包上肩，踏出宿舍
    story: 字幕「她，永和；他，三重。」101 映入眼簾→女方微笑
    camera: 兩邊各自手持跟拍；中線滑動推近收成單畫面
    sound: 鍋鏟聲、拉拉鍊細節→淡化回音樂
  shots:
  - id: w02a-she-ready
    kind: omni
    duration: 10
    refs:
    - kf02a
    - she-sheet
    - style-clay
    use: 15–25 分割畫面左半（裁中間 640×720）
    zh: 永和小公寓清晨，她綁頭髮、檢查包包、從架上拿鑰匙；廚房傳來鍋鏟聲。
    prompt: Early morning in a small, cozy apartment in Yonghe. The woman from the reference images, in her casual outfit, ties her hair back, checks her tan crossbody bag and picks up her keys from a shelf. Handheld follow shot. Keep her and all of her action inside the central third of the frame at all times, because the frame will be cropped to a narrow vertical strip.
    ambient: a frying pan sizzling and a spatula scraping in the kitchen nearby, keys jingling
  - id: w02b-he-leave
    kind: omni
    duration: 10
    refs:
    - kf02b
    - kf02c
    - he-sheet
    - style-clay
    use: 15–25 分割畫面右半（裁中間 640×720）
    zh: 三重高樓的房間裡，他把背包甩上肩→走出現代大樓的玻璃門口（石材雨遮、行道樹、機車）。
    prompt: '[0-5s] Morning in the man''s tidy high-floor bedroom from image 1: he swings his black backpack onto his shoulder and heads for the door. [5-10s] Cut to the entrance of his modern apartment building from image 2: he walks out through the glass doors under the dark stone canopy onto the sidewalk. Handheld follow shot. Keep him and all of his action inside the central third of the frame at all times, because the frame will be cropped to a narrow vertical strip.'
    ambient: a zipper closing, the door latch, footsteps, distant scooters outside
  - id: w02c-she-101
    kind: omni
    duration: 8
    refs:
    - kf02a
    - she-sheet
    - style-clay
    use: 25–27 中線滑開轉場、27–35 全畫面
    zh: 她走到窗邊，遠方晨霧中的台北 101；鏡頭從肩後推到側臉，她微微一笑。
    prompt: The woman from the reference images steps to her apartment window; far away through the glass, Taipei 101 rises above the city in soft morning haze. She pauses and smiles softly. Slow push-in from behind her shoulder around to her smiling profile.
    ambient: quiet room tone, faint city outside
  captions:
  - tc: 16–24
    text: 她，永和；
    where: 左半下方
  - tc: 16–24
    text: 他，三重。
    where: 右半下方
  edit: 15–25 左右並排；25–27 中線往右滑把右半推出畫面，收成 w02c 單畫面；兩支的環境音在 25–28 淡出、鋼琴回來。
  music: M1 持續（壓低，讓鍋鏟與拉鍊聲出來）
  notes:
  - 分割畫面裁切：每支 1280×720 只取中間 640 寬，prompt 已要求動作留在中間三分之一；仍要用草稿確認。
- id: '03'
  tc:
  - 35
  - 55
  title: 各自出發・左右分割對望
  board:
    picture: 左：她在永和市區的公車上；右：他搭公車上新北大橋。兩人其實看不到彼此，畫面左右分割，各自望向不存在的遠方，像在對看
    story: 旁白「走過大橋，看見 101，就像回到家。」
    camera: 左右分割畫面，兩邊各自緩慢推近；接河濱、自行車道、101 的快速剪接；最後定格 101
    sound: 弦樂層次加入
  shots:
  - id: w03a-she-bus
    kind: omni
    duration: 12
    refs:
    - kf03a
    - she-sheet
    - style-clay
    use: 35–47 分割畫面左半（裁中間 640×720）
    zh: 她坐在永和市區公車窗邊，望向畫面右方的遠處，淺淺地笑。
    prompt: 'Morning inside a city bus moving through the streets of Yonghe: the woman sits at the window seat and gazes far off toward screen-right with a soft, wistful smile, as if looking at someone very far away. Shops and scooters slide past the window. Slow push-in. Keep her inside the central third of the frame at all times, because the frame will be cropped to a narrow vertical strip.'
    ambient: bus engine, city traffic, a stop bell
  - id: w03b-he-bridge
    kind: omni
    duration: 12
    refs:
    - kf03b
    - he-sheet
    - kf01
    - style-clay
    use: 35–47 分割畫面右半（裁中間 640×720）
    zh: 他坐在過新北大橋的公車窗邊，望向畫面左方的遠處，淺淺地笑；窗外是單塔斜張橋和河面。
    prompt: 'Morning inside a city bus crossing the cable-stayed bridge: the man sits at the window seat and gazes far off toward screen-left with a soft smile, as if looking at someone very far away; through the window the single tall pylon, the fanned cables and the wide river pass by. Slow push-in. Keep him inside the central third of the frame at all times, because the frame will be cropped to a narrow vertical strip.'
    ambient: bus engine humming over the bridge, wind
  - id: w03c-cutaways
    kind: omni
    duration: 5
    refs:
    - kf01
    - style-clay
    use: 47–52 快速剪接
    zh: 河濱公園、自行車道、遠方另一座橋，停在 101。
    prompt: 'Quick jump cuts, about one second each, of the riverside seen from a moving bus: the riverside park, cyclists on the bike path, another bridge in the distance, ending on a clear view of Taipei 101 on the skyline. No characters.'
    ambient: bus engine, wind
  - id: w03-freeze
    kind: freeze
    duration: 3
    use: 52–55 w03c 最後一格定格 101＋緩慢推近
    zh: 定格 101。
  vo:
  - tc: 44–50
    speaker: 旁白
    text: 走過大橋，看見 101，就像回到家。
    style: warm, smiling
  music: M1 在 ~40 秒加入弦樂
  notes:
  - 兩人其實看不見彼此：她在永和市區，他在新北大橋上。對望只靠分割畫面的視線方向成立。
  edit: 35–47 左右並排（左 w03a、右 w03b），兩人視線朝向中線，像隔著畫面對望；47 起切全畫面。
- id: '04'
  tc:
  - 55
  - 70
  title: 聊天泡泡
  board:
    picture: 手機聊天泡泡動畫覆疊：男方「妳喜歡日式水果蛋糕嗎？」→女方「女生拒絕不了甜點呀！」
    story: 卡通 Pop-up 字卡
    camera: Push in 至手機→閃白轉場
    sound: 木琴可愛點綴
  shots:
  - id: st-phone
    kind: still
    duration: 15
    use: 55–69 Ken Burns 推近；聊天泡泡合成在螢幕區；69–70 閃白
    zh: 她手拿手機的特寫照（螢幕留白），泡泡和貼圖後製貼上去，不用影片。
  gfx:
  - tc: '58'
    text: 妳喜歡日式水果蛋糕嗎？
    where: 左側灰泡泡（他）
  - tc: 61–62
    text: 「…」輸入中
    where: 右側
  - tc: '63'
    text: 女生拒絕不了甜點呀！
    where: 右側綠泡泡（她）
  - tc: '65'
    text: 卡通蛋糕／愛心 pop-up 貼圖
    where: 螢幕外緣彈出
  music: M2（木琴短曲）
  notes:
  - 泡泡用 HTML 排版再以 Playwright 逐格輸出 PNG 序列，或 ffmpeg drawbox+drawtext；字型用 Noto Sans TC。
- id: '05'
  tc:
  - 70
  - 90
  title: 初次見面・日式蛋糕店
  board:
    picture: 近鏡：叉子切下草莓蛋糕；拉出 2 Shot 對坐
    story: 女方旁白「甜點，是我們的序章。」
    camera: Slide Out 至 45° 高角度
    sound: Café ambience
  shots:
  - id: w05a-cake
    kind: omni
    duration: 12
    refs:
    - kf05
    - she-sheet
    - he-sheet
    - style-clay
    use: 70–82
    zh: 叉子切草莓鮮奶油蛋糕的微距→平順拉遠，兩人在窗邊小木桌對坐，有點害羞地笑。
    prompt: '[0-5s] Macro close-up: a fork slices into a Japanese strawberry shortcake, soft sponge, whipped cream and a glossy strawberry. [5-12s] The camera pulls back smoothly in one continuous move to reveal the woman and the man sitting across from each other at a small wooden table by the window of a bright, minimal Japanese-style cake shop, both a little shy, smiling at each other.'
    ambient: café chatter murmuring, cups and saucers clinking, a soft espresso machine
  - id: w05b-cake-high
    kind: omni
    duration: 8
    refs:
    - kf05
    - she-sheet
    - he-sheet
    - style-clay
    use: 82–90
    zh: 鏡頭側滑並升到 45° 俯角，兩人邊吃邊笑。
    prompt: The camera slides sideways and rises to a 45-degree high angle above the small table in the Japanese cake shop; the woman and the man share the strawberry shortcake, laughing easily together.
    ambient: café chatter murmuring, cups and saucers clinking
  vo:
  - tc: 78–84
    speaker: 女主
    text: 甜點，是我們的序章。
    style: soft, smiling, intimate
  music: M3 開始（輕木吉他，壓在 café 環境音下）
- id: '06'
  tc:
  - 90
  - 110
  title: 剝皮寮漫步
  board:
    picture: 剝皮寮紅磚巷道漫步；逆光剪影對談
    story: 字幕「歷史裡，寫下新的我們。」
    camera: 手持跟隨→定格拍立得效果
    sound: Acoustic guitar
  shots:
