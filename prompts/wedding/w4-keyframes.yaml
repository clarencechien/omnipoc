  text: 'Image 1 is the couple in their registration-day outfits; image 2 is the certificate reference: the couple''s own illustrated marriage certificate design; image 3 is the approved art style (sculpted matte clay figurines placed in a painted storybook set). Inside a bright household registration office: the couple in their registration-day outfits sit side by side at the service counter, she holding her bouquet; a friendly clerk, a simple clay figure, slides their new marriage certificate across the counter toward them, the certificate facing the couple and the camera; a pen and a red seal stamp with an ink pad on the counter. The marriage certificate is a SIMPLIFIED version of the card in the certificate reference: a portrait card whose top half is a cheerful blue illustrated night sky with tiny fireworks, a little city skyline and a tiny waving cartoon couple, and whose bottom half is white with a few faint orange and grey lines; seen small, softly, with no readable words, no names
    and no numbers. Every character is a dimensional sculpted matte clay figurine exactly like the people in the art-style image, about four heads tall, adult, never a flat 2D drawing; mouths closed in small gentle smiles. the couple keep EXACTLY their registration-day outfits: he wears black rectangular glasses, a black relaxed suit over a white crewneck and black shoes; she has half-up wavy brown hair, a blush pink cardigan, an ivory calf-length dress, ivory Mary Jane shoes and a small blush bouquet. Recreate any real place in the same warm matte clay and gouache storybook style. Cinematic composition. Any signs, plaques or screens are blank; no readable text and no logos. No photorealism, no glossy plastic.'
