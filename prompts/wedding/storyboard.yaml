meta:
  title: 兩條河之間（暫名）
  version: v5
  duration_s: 300
  aspect: '16:9'
  final_res: 720p
  draft_res: 360p
  drafts_per_shot: 2
  finals_per_shot: 1.2
style: 'Animated 3D storybook short film in the approved style of The Playbill: the couple are about four heads tall, adult, rendered as sculpted matte clay figurines with painted gouache texture and fine fabric grain and rounded dimensional hands, placed inside painted storybook versions of real places in Taipei, New Taipei and Yunlin, warm soft golden lighting, gentle cinematic camera, 24fps. Keep faces, glasses, hairstyles and outfits identical to the references in every frame. The characters do not talk: mouths stay closed in small gentle smiles unless they laugh softly. No readable text, signs, captions or logos anywhere in the frame; any sign or plaque is blank. No photorealism, no glossy plastic.'
audio_rule: No dialogue, no speech, no singing, no music.
characters:
  she:
    zh: 女主（取自 theplaybillv2 定案人物）：約 4 頭身，公主頭半束深棕波浪長髮、圓臉腮紅、閉嘴微笑。便服＝燕麥色針織毛衣、鼠尾草綠百褶長裙、白布鞋、棕色斜背小包；登記日＝粉色針織外套、象牙白長洋裝、象牙白瑪莉珍鞋、捧花
    en: about four heads tall with half-up princess-style wavy dark-brown hair, rounded blushing cheeks and a small gentle smile
    label: the woman
  he:
    zh: 男主（取自 theplaybillv2 定案人物）：約 4 頭身，黑框方眼鏡、後梳短黑髮、圓臉。便服＝海軍藍襯衫外套敞開、白 T、卡其褲、白布鞋、黑後背包；登記日＝黑色休閒西裝、白色圓領 T、黑皮鞋
    en: about four heads tall with black rectangular glasses, short swept black hair, rounded cheeks and a small gentle smile
    label: the man
