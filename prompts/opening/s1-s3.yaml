# S1–S3 drafts for the treasure-hunt title sequence. Style 1 = live-action (chosen by Clarence 2026-11-07).
# All 360p / 16:9. "No music" everywhere: the score is added in post (Lyria).
version: s1s3-v1
style: &style >-
  Cinematic live-action footage, anamorphic lens, subtle 35mm film grain, moody teal-and-amber color grade, shallow depth of
  field, golden-hour light breaking through storm clouds.
videos:
  # ---------- S1: shot #6, hero character beat. With vs without reference image.
  - id: s1-hunter-ref
    duration: 8
    text: >-
      The first image is a style and character reference: match its look, the same woman (treasure hunter in her 30s, short
      dark hair, sun-worn linen shirt, leather satchel), the same volcanic shore and rowboat. Cinematic live-action footage,
      anamorphic lens, subtle 35mm film grain, moody teal-and-amber grade, shallow depth of field. One continuous handheld
      tracking shot: she steps out of the wooden rowboat onto wet black sand, takes three steps up the beach, then stops and
      glances back over her shoulder toward the camera, an antique brass compass in her hand. Waves break behind her, sea
      spray, wind in her hair. No cuts. No dialogue. No music; only wind, surf and footsteps.
    refs: [review/opening/s0/style-live.jpg]
  - id: s1-hunter-noref
    duration: 8
    text: >-
      Cinematic live-action footage, anamorphic lens, subtle 35mm film grain, moody teal-and-amber grade, shallow depth of
      field, golden-hour light breaking through storm clouds. One continuous handheld tracking shot: a treasure hunter in her
      30s, short dark hair, sun-worn linen shirt, leather satchel, steps out of a wooden rowboat onto the wet black sand of a
      wild volcanic island shore, takes three steps up the beach, then stops and glances back over her shoulder toward the
      camera, an antique brass compass in her hand. Waves break behind her, sea spray, wind in her hair. No cuts. No dialogue.
      No music; only wind, surf and footsteps.
  # ---------- S2: shot #4, compass close-up. Three approaches.
  - id: s2-compass-text
    duration: 6
    text: >-
      Cinematic live-action macro footage, 35mm film grain, golden-hour rim light, shallow depth of field. Extreme close-up of
      an antique brass MAGNETIC COMPASS held open in a weathered hand. The dial is white enamel with a printed compass rose
      and the cardinal letters N, E, S, W and a degree ring. There is exactly ONE slender steel needle on a central pivot,
      blued steel on its north half. NO clock numerals, NO clock hands, NO Roman numerals, NO minute track. The needle swings
      left and right, slows, and settles pointing firmly toward the letter W, not north. Locked-off camera, slow push-in.
      No dialogue. No music; only wind and a faint metallic tick.
  - id: s2-compass-ref1
    duration: 6
    text: >-
      The first image is the exact compass to use: reproduce its dial (compass rose, letters N E S W, degree ring) and its
      single blued-steel needle; do not add clock numerals or clock hands. Cinematic live-action macro footage, 35mm film
      grain, golden-hour rim light, shallow depth of field. Extreme close-up of this compass held open in a weathered hand.
      The needle swings left and right, slows, and settles pointing firmly toward the letter W, not north. Locked-off camera,
      slow push-in. No dialogue. No music; only wind and a faint metallic tick.
    refs: [review/opening/s0/compass-front.jpg]
  - id: s2-compass-ref2
    duration: 6
    text: >-
      The first image is the exact compass to use (dial with compass rose, letters N E S W, degree ring, single blued-steel
      needle); the second image shows the shot's framing, lighting and the hand holding it: start from that framing. Do not
      add clock numerals or clock hands. Cinematic live-action macro footage, 35mm film grain, golden-hour rim light, shallow
      depth of field. The needle swings left and right, slows, and settles pointing firmly toward the letter W, not north.
      Locked-off camera, slow push-in. No dialogue. No music; only wind and a faint metallic tick.
    refs: [review/opening/s0/compass-front.jpg, review/opening/s0/compass-live.jpg]
  # ---------- S3: continuity. (a) separate shots #2 and #3; (b) one 15 s timecoded clip covering both.
  - id: s3a-sea
    duration: 8
    text: >-
      Cinematic live-action footage, anamorphic lens, subtle 35mm film grain, moody teal-and-amber grade. Wide establishing
      shot at dusk: a small wooden sailing ship with a single tattered sail pitches through heavy storm swells, rain and spray,
      a volcanic island with a glowing crater just visible on the horizon through breaking clouds. Slow aerial drift forward
      toward the ship. No cuts. No dialogue. No music; only wind, rain and waves.
  - id: s3a-cabin
    duration: 6
    text: >-
      The first image is the exact compass to use; do not add clock numerals or clock hands. Cinematic live-action footage,
      35mm film grain, warm swinging lantern light, shallow depth of field. Inside a cramped wooden ship's cabin at night, the
      hull creaking and tilting with the storm: a weathered hand lifts the lid of a small iron-banded wooden box on a table,
      revealing this brass compass resting on a folded parchment map. Slow push-in toward the box. No cuts. No dialogue.
      No music; only creaking timbers, muffled storm and rain.
    refs: [review/opening/s0/compass-front.jpg]
  - id: s3b-timecode
    duration: 15
    text: >-
      The first image is the exact compass to use; do not add clock numerals or clock hands. Cinematic live-action footage,
      anamorphic lens, subtle 35mm film grain, moody teal-and-amber grade.
      [0-8s] Wide establishing shot at dusk: a small wooden sailing ship with a single tattered sail pitches through heavy
      storm swells, rain and spray, a volcanic island with a glowing crater just visible on the horizon. Slow aerial drift
      forward toward the ship.
      [8-15s] Cut to the cramped wooden cabin inside the ship at night, lantern swinging: a weathered hand lifts the lid of a
      small iron-banded wooden box on a table, revealing the brass compass resting on a folded parchment map. Slow push-in.
      No dialogue. No music; only wind, rain, waves and creaking timbers.
    refs: [review/opening/s0/compass-front.jpg]
