# 婚禮／愛情故事 5 分鐘短片 — 分鏡單一事實來源
# 由 src/storyboard.py 產生：docs/storyboard-wedding.md（人讀）、prompts/wedding/videos.yaml（給 src/run.py）、
# prompts/wedding/refs.yaml 與 stills.yaml（給 src/run_image.py）。改內容請改這個檔，不要改產出物。
meta:
  title: 兩條河之間（暫名）
  version: v1
  duration_s: 300
  aspect: "16:9"
  final_res: 720p        # 定稿 720p，本機放大到 1080p（Google 1080p 為選項，見文件第 1 節）
  draft_res: 360p
  drafts_per_shot: 2
  finals_per_shot: 1.2   # 平均定稿支數（含重試）

# 每支 Omni 影片 prompt 都會自動加上這段風格與音訊規則
style: >-
  Live-action romantic short-film footage shot on location in Taipei and New Taipei, Taiwan. Natural, warm,
  slightly desaturated color grade with soft peach highlights and teal shadows, subtle 35mm film grain, shallow
  depth of field, cinematic 24fps look. Realistic people and places. No readable text, signs, captions or logos
  anywhere in the frame.
audio_rule: No dialogue, no speech, no singing, no music.

characters:
  she:
    zh: 女主・永和女生，20 代後半，及肩黑直髮、空氣瀏海，淡妝，纖細
    en: a Taiwanese woman in her late 20s with shoulder-length straight black hair and soft see-through bangs, light natural makeup, gentle eyes, slim build
    label: the woman
  he:
    zh: 男主・三重男生（雲林出身），20 代後半，短黑髮、細黑框眼鏡，笑容親切，中等身材
    en: a Taiwanese man in his late 20s with short neat black hair and thin black rectangular glasses, a friendly smile, medium build
    label: the man

# 參考圖。source: photo = 請 Clarence 提供自己拍的或有授權的照片（優先）；generate = 用 Nano Banana 2 生成（備案）
refs:
  - id: she-front
    kind: character
    who: she
    source: generate
    aspect: "1:1"
    prompt: >-
      Character reference portrait, front view, head and shoulders, plain light-grey background, soft even studio
      light. A Taiwanese woman in her late 20s with shoulder-length straight black hair and soft see-through bangs,
      light natural makeup, gentle eyes, slim build, wearing a cream knit cardigan over a white blouse. Photo-real,
      sharp focus, no text.
  - id: she-34
    kind: character
    who: she
    source: generate
    aspect: "1:1"
    from: [she-front]
    prompt: >-
      The same woman as the reference image, now in a three-quarter view, slight smile, head and shoulders, same hair,
      same makeup, same cream knit cardigan, plain light-grey background, soft studio light. Photo-real, no text.
  - id: she-full
    kind: character
    who: she
    source: generate
    aspect: "1:1"
    from: [she-front]
    prompt: >-
      The same woman as the reference image, full-body standing pose, cream knit cardigan over a white blouse, light
      blue jeans, white sneakers, small tan crossbody bag, plain light-grey background, soft studio light. Photo-real,
      no text.
  - id: he-front
    kind: character
    who: he
    source: generate
    aspect: "1:1"
    prompt: >-
      Character reference portrait, front view, head and shoulders, plain light-grey background, soft even studio
      light. A Taiwanese man in his late 20s with short neat black hair and thin black rectangular glasses, a friendly
      smile, medium build, wearing a navy casual shirt over a grey T-shirt. Photo-real, sharp focus, no text.
  - id: he-34
    kind: character
    who: he
    source: generate
    aspect: "1:1"
    from: [he-front]
    prompt: >-
      The same man as the reference image, now in a three-quarter view, relaxed smile, head and shoulders, same hair,
      same glasses, same navy shirt over grey T-shirt, plain light-grey background, soft studio light. Photo-real, no text.
  - id: he-full
    kind: character
    who: he
    source: generate
    aspect: "1:1"
    from: [he-front]
    prompt: >-
      The same man as the reference image, full-body standing pose, navy casual shirt over a grey T-shirt, khaki
      chinos, canvas sneakers, a black backpack on one shoulder, plain light-grey background, soft studio light.
      Photo-real, no text.
  - id: loc-bridge
    kind: location
    zh: 新北大橋（大漢溪）
    source: photo
    aspect: "16:9"
    prompt: >-
      A long modern road bridge in New Taipei City spanning the wide Dahan River, seen from the riverbank at sunrise,
      light morning mist on the water, photo-real, no readable text.
  - id: loc-bopiliao
    kind: location
    zh: 剝皮寮歷史街區
    source: photo
    aspect: "16:9"
    prompt: >-
      Bopiliao Historic Block in Wanhua, Taipei: a narrow pedestrian street lined with old red-brick shophouses with
      arched arcades, late-afternoon sun low at the end of the street, photo-real, no readable signage.
  - id: loc-guesthouse
    kind: location
    zh: 台北賓館外（夜）
    source: photo
    aspect: "16:9"
    prompt: >-
      Taipei Guest House at night: an ornate white Western-style historic mansion behind a black iron fence, softly lit
      facade, tree-lined sidewalk in front, photo-real, no readable text.
  - id: loc-4444
    kind: location
    zh: 四四南村
    source: photo
    aspect: "16:9"
    prompt: >-
      Four Four South Village in Xinyi District, Taipei, at dusk: rows of low old grey-brick military-dependents'
      village houses beside an open grassy lawn, Taipei 101 towering directly behind, photo-real, no readable text.
  - id: loc-park4
    kind: location
    zh: 永和四號公園噴水池（夜）
    source: photo
    aspect: "16:9"
    prompt: >-
      Yonghe No. 4 Park in New Taipei City at night: a large neighborhood park with a musical fountain lit in warm and
      colored lights, trees around, photo-real, no readable text.
  - id: loc-riverside
    kind: location
    zh: 永和河濱公園／河堤
    source: photo
    aspect: "16:9"
    prompt: >-
      Yonghe Riverside Park along the Xindian River in late afternoon: a riverside bike path, wide grass, a low river
      levee, and the Taipei skyline with Taipei 101 across the river, photo-real, no readable text.
  - id: loc-sanheyuan
    kind: location
    zh: 雲林老家三合院
    source: photo
    aspect: "16:9"
    prompt: >-
      A traditional red-brick sanheyuan courtyard house in rural Yunlin, Taiwan, with curved swallowtail roof ridges,
      a sunlit front courtyard, surrounded by green rice fields, morning, photo-real, no readable text.
  - id: loc-school
    kind: location
    zh: 男主母校（男校）校門
    source: photo
    aspect: "16:9"
    prompt: >-
      The front gate of a Taiwanese boys' senior high school on a sunny day, a plain modern gate with trees and a
      school building behind, photo-real, no readable text or signage.
  - id: loc-paddy
    kind: location
    zh: 雲林稻田晨光
    source: generate
    aspect: "16:9"
    prompt: >-
      Green rice paddies in Yunlin, Taiwan, at dawn, low mist over the fields, a narrow earthen ridge path leading into
      the soft golden light, photo-real, no text.

# 不用影片、用圖做的鏡頭（Ken Burns／合成底圖）
stills:
  - id: st-phone
    aspect: "16:9"
    from: [she-front]
    prompt: >-
      Close-up of the woman's hands (from the reference image) holding a smartphone upright in a cozy room at night,
      warm lamp light. The phone screen faces the camera, is in sharp focus, and is completely blank, plain light grey,
      with no interface, no text and no icons. Background softly blurred. Photo-real, no text.
  - id: st-tower
    aspect: "16:9"
    prompt: >-
      Low-angle night view of the illuminated central tower of the red-brick Presidential Office Building in Taipei,
      deep blue night sky, photo-real, no readable text.
  - id: st-uniform
    aspect: "4:3"
    from: [he-front]
    prompt: >-
      A faded, slightly overexposed snapshot photo from about ten years ago: the man from the reference image as a
      17-year-old high-school student, same face, younger, grinning at the camera in a light khaki short-sleeve
      Taiwanese school uniform shirt, standing in front of a school building. Film-photo look with soft vignetting.
      No readable text, name tag blank.

segments:
  - id: "01"
    tc: [0, 15]
    title: 日出・新北大橋
    board:
      picture: 【日出】新北大橋遠景，橋面車流慢速疊化至大漢溪水面反射
      story: 旁白「在兩條河的交會，一座橋讓兩顆心每天相遇。」
      camera: 航拍→輕推進；淡入
      sound: 純鋼琴・溫暖前奏
    shots:
      - id: w01-bridge
        kind: omni
        duration: 15
        refs: [loc-bridge]
        use: 0–15 全段；0–2 秒由黑淡入
        zh: 日出航拍新北大橋，車流緩慢；後段鏡頭下搖到大漢溪水面，橋與朝霞的倒影。
        prompt: >-
          [0-9s] Aerial drone shot at sunrise of the long river bridge from the location reference, light traffic
          moving slowly across it, golden early light and thin mist over the wide river; the drone glides forward and
          gently descends. [9-15s] The camera tilts down from the bridge deck to the calm river surface, where the
          bridge, the pink sky and the rising sun are mirrored, soft ripples breaking the reflection. Slow, smooth,
          one continuous shot.
        ambient: soft morning wind, distant traffic hum, water lapping
    vo:
      - {tc: "3–10", speaker: 旁白, text: 在兩條河的交會，一座橋讓兩顆心每天相遇。, style: "warm, calm, unhurried"}
    music: M1 開始（鋼琴前奏）
    notes:
      - 地理：新北大橋跨的是大漢溪、連接板橋與新莊，並不在永和與三重之間；大漢溪與新店溪的「兩河交會」在華江橋一帶。旁白是象徵用法可以保留，但在地觀眾會注意到。

  - id: "02"
    tc: [15, 35]
    title: 她，永和；他，三重（分割畫面）
    board:
      picture: 左：永和女方準備出門，窗外台北 101。右：三重男方背包上肩，踏出宿舍
      story: 字幕「她，永和；他，三重。」101 映入眼簾→女方微笑
      camera: 兩邊各自手持跟拍；中線滑動推近收成單畫面
      sound: 鍋鏟聲、拉拉鍊細節→淡化回音樂
    shots:
      - id: w02a-she-ready
        kind: omni
        duration: 10
        refs: [she-front, she-34, she-full]
        use: 15–25 分割畫面左半（裁中間 640×720）
        zh: 永和小公寓清晨，她綁頭髮、檢查包包、從架上拿鑰匙；廚房傳來鍋鏟聲。
        prompt: >-
          Early morning in a small, cozy apartment in Yonghe. The woman from the reference images, wearing the cream
          knit cardigan, ties her hair back, checks her tan crossbody bag and picks up her keys from a shelf. Handheld
          follow shot. Keep her and all of her action inside the central third of the frame at all times, because the
          frame will be cropped to a narrow vertical strip.
        ambient: a frying pan sizzling and a spatula scraping in the kitchen nearby, keys jingling
      - id: w02b-he-leave
        kind: omni
        duration: 10
        refs: [he-front, he-34, he-full]
        use: 15–25 分割畫面右半（裁中間 640×720）
        zh: 三重宿舍清晨，他把黑色背包甩上肩、拉上拉鍊，開門走進走廊。
        prompt: >-
          Early morning in a simple shared university dormitory room in Sanchong. The man from the reference images
          swings his black backpack onto his shoulder, zips its front pocket shut, opens the door and steps out into
          the corridor. Handheld follow shot. Keep him and all of his action inside the central third of the frame at
          all times, because the frame will be cropped to a narrow vertical strip.
        ambient: a zipper closing, the door latch, footsteps, distant scooters outside
      - id: w02c-she-101
        kind: omni
        duration: 8
        refs: [she-front, she-34]
        use: 25–27 中線滑開轉場、27–35 全畫面
        zh: 她走到窗邊，遠方晨霧中的台北 101；鏡頭從肩後推到側臉，她微微一笑。
        prompt: >-
          The woman from the reference images steps to her apartment window; far away through the glass, Taipei 101
          rises above the city in soft morning haze. She pauses and smiles softly. Slow push-in from behind her
          shoulder around to her smiling profile.
        ambient: quiet room tone, faint city outside
    captions:
      - {tc: "16–24", text: 她，永和；, where: 左半下方}
      - {tc: "16–24", text: 他，三重。, where: 右半下方}
    edit: 15–25 左右並排；25–27 中線往右滑把右半推出畫面，收成 w02c 單畫面；兩支的環境音在 25–28 淡出、鋼琴回來。
    music: M1 持續（壓低，讓鍋鏟與拉鍊聲出來）
    notes:
      - 分割畫面裁切：每支 1280×720 只取中間 640 寬，prompt 已要求動作留在中間三分之一；仍要用草稿確認。

  - id: "03"
    tc: [35, 55]
    title: 橋上錯身
    board:
      picture: 公車駛上新北大橋→橋上對向車窗內，兩人視線交錯；遠景中正橋、河濱、自行車道
      story: 旁白「走過大橋，看見 101，就像回到家。」
      camera: 車內搖鏡→Cut 連跳；最後定格 101
      sound: 弦樂層次加入
    shots:
      - id: w03-buses
        kind: omni
        duration: 15
        refs: [she-front, she-34, he-front, he-34, loc-bridge]
        use: 35–50 全段
        zh: 公車上橋→她在車窗邊→兩車在橋上交會、隔著兩層車窗四目相接→連跳河濱、自行車道、遠方另一座橋，停在 101。
        prompt: >-
          [0-4s] Exterior, morning: a city bus drives up onto the long river bridge from the location reference, the
          river and riverside bike paths below, another bus approaching from the opposite direction. [4-8s] Inside the
          first bus: the woman sits by the window in morning light, watching the river; the camera pans slowly along the
          window. [8-11s] The two buses pass each other on the bridge; through two layers of bus windows, the woman and
          the man, who sits in the other bus, catch each other's eyes for a brief moment. [11-15s] Quick jump cuts seen
          through the bus window: the riverside park, cyclists on the bike path, another bridge in the distance, ending
          on a clear view of Taipei 101 on the skyline.
        ambient: bus engine, air brakes hissing, soft city hum
      - id: w03-freeze
        kind: freeze
        duration: 5
        use: 50–55 取 w03 最後一格定格 + 緩慢推近
        zh: 定格在 101，ffmpeg 慢推。
    vo:
      - {tc: "44–50", speaker: 旁白, text: 走過大橋，看見 101，就像回到家。, style: "warm, smiling"}
    music: M1 在 ~40 秒加入弦樂
    notes:
      - 遠景的中正橋不點名（模型不認得），prompt 寫成 another bridge。

  - id: "04"
    tc: [55, 70]
    title: 聊天泡泡
    board:
      picture: 手機聊天泡泡動畫覆疊：男方「妳喜歡日式水果蛋糕嗎？」→女方「女生拒絕不了甜點呀！」
      story: 卡通 Pop-up 字卡
      camera: Push in 至手機→閃白轉場
      sound: 木琴可愛點綴
    shots:
      - id: st-phone
        kind: still
        duration: 15
        use: 55–69 Ken Burns 推近；聊天泡泡合成在螢幕區；69–70 閃白
        zh: 她手拿手機的特寫照（螢幕留白），泡泡和貼圖後製貼上去，不用影片。
    gfx:
      - {tc: "58", text: 妳喜歡日式水果蛋糕嗎？, where: 左側灰泡泡（他）}
      - {tc: "61–62", text: 「…」輸入中, where: 右側}
      - {tc: "63", text: 女生拒絕不了甜點呀！, where: 右側綠泡泡（她）}
      - {tc: "65", text: 卡通蛋糕／愛心 pop-up 貼圖, where: 螢幕外緣彈出}
    music: M2（木琴短曲）
    notes:
      - 泡泡用 HTML 排版再以 Playwright 逐格輸出 PNG 序列，或 ffmpeg drawbox+drawtext；字型用 Noto Sans TC。

  - id: "05"
    tc: [70, 90]
    title: 初次見面・日式蛋糕店
    board:
      picture: 近鏡：叉子切下草莓蛋糕；拉出 2 Shot 對坐
      story: 女方旁白「甜點，是我們的序章。」
      camera: Slide Out 至 45° 高角度
      sound: Café ambience
    shots:
      - id: w05a-cake
        kind: omni
        duration: 12
        refs: [she-front, she-34, he-front, he-34]
        use: 70–82
        zh: 叉子切草莓鮮奶油蛋糕的微距→平順拉遠，兩人在窗邊小木桌對坐，有點害羞地笑。
        prompt: >-
          [0-5s] Macro close-up: a fork slices into a Japanese strawberry shortcake, soft sponge, whipped cream and a
          glossy strawberry. [5-12s] The camera pulls back smoothly in one continuous move to reveal the woman and the
          man sitting across from each other at a small wooden table by the window of a bright, minimal Japanese-style
          cake shop, both a little shy, smiling at each other.
        ambient: café chatter murmuring, cups and saucers clinking, a soft espresso machine
      - id: w05b-cake-high
        kind: omni
        duration: 8
        refs: [she-front, she-34, he-front, he-34]
        use: 82–90
        zh: 鏡頭側滑並升到 45° 俯角，兩人邊吃邊笑。
        prompt: >-
          The camera slides sideways and rises to a 45-degree high angle above the small table in the Japanese cake shop;
          the woman and the man share the strawberry shortcake, laughing easily together.
        ambient: café chatter murmuring, cups and saucers clinking
    vo:
      - {tc: "78–84", speaker: 女主, text: 甜點，是我們的序章。, style: "soft, smiling, intimate"}
    music: M3 開始（輕木吉他，壓在 café 環境音下）

  - id: "06"
    tc: [90, 110]
    title: 剝皮寮漫步
    board:
      picture: 剝皮寮紅磚巷道漫步；逆光剪影對談
      story: 字幕「歷史裡，寫下新的我們。」
      camera: 手持跟隨→定格拍立得效果
      sound: Acoustic guitar
    shots:
      - id: w06-bopiliao
        kind: omni
        duration: 15
        refs: [she-front, he-front, loc-bopiliao]
        use: 90–105
        zh: 午後紅磚騎樓巷，兩人背對鏡頭並肩慢走、逆光成剪影、邊走邊聊；手持從後跟拍。
        prompt: >-
          Late afternoon in the old red-brick arcade street from the location reference. The woman and the man walk
          slowly side by side away from the camera toward the low sun, backlit into near-silhouettes, talking and
          gesturing as they go. Handheld follow shot from behind.
        ambient: footsteps on brick, distant city murmur, a bicycle bell far away
      - id: w06-polaroid
        kind: freeze
        duration: 5
        use: 105–110 定格→加白框、微傾、陰影變拍立得，快門聲
        zh: 取 w06 一格做成拍立得，字幕寫在相紙下緣。
    captions:
      - {tc: "105–110", text: 歷史裡，寫下新的我們。, where: 拍立得下緣，手寫感字體}
    sfx: [拍立得快門聲（105）]
    music: M3 木吉他

  - id: "07"
    tc: [110, 130]
    title: 三重迴轉壽司
    board:
      picture: 迴轉壽司吧檯：男方趁空位把女方抱到大腿上；女方臉紅特寫
      story: 無字幕，放大心跳聲 FX
      camera: 慢動作＋疊化心型動畫
      sound: BGM 弱化，加入心跳
    shots:
      - id: w07a-sushi
        kind: omni
        duration: 10
        refs: [she-front, she-34, he-front, he-34]
        use: 110–120
        zh: 午餐尖峰，吧檯只剩一張椅子，他坐下拍拍大腿，她猶豫一下坐上去，又窘又笑；壽司盤從面前滑過。
        prompt: >-
          A busy conveyor-belt sushi bar in Sanchong at lunchtime. Every stool along the counter is taken except one.
          The man sits down on it, laughs and pats his lap; the woman hesitates, then sits on his lap, embarrassed and
          smiling, as plates of sushi glide past on the belt in front of them. Medium two-shot from across the belt.
        ambient: restaurant buzz, the conveyor belt clattering softly, plates clinking
      - id: w07b-blush
        kind: omni
        duration: 10
        refs: [she-front, she-34, she-full]
        use: 120–130
        zh: 慢動作臉部特寫，她臉紅低頭再抬眼害羞一笑。
        prompt: >-
          Extreme slow motion, close-up of the woman's face as she blushes and looks down, then lifts her eyes with a
          shy smile; warm light, the conveyor belt softly blurred behind her.
        ambient: muffled restaurant buzz
    overlays: [心型動畫疊化（120–130，跟心跳同步脈動）]
    sfx: [心跳聲（118–130，逐漸放大）]
    music: M3 壓低到 −18 dB

  - id: "08"
    tc: [130, 150]
    title: 台北賓館外・牽手
    board:
      picture: 台北賓館外夜色：兩人並肩而行，男方小指碰觸→牽手成功
      story: 男方旁白「原來手心的溫度，是這樣的剛好。」
      camera: 移動長鏡頭→鏡頭上移對剪塔尖
      sound: 弦樂再次漸起
    shots:
      - id: w08-guesthouse
        kind: omni
        duration: 15
        refs: [she-front, she-34, he-front, he-34, loc-guesthouse]
        use: 130–145
        zh: 夜裡沿台北賓館鐵欄外的人行道並肩走（側面長鏡頭）→手部特寫：小指碰到、牽起→鏡頭從牽著的手上搖到夜空。
        prompt: >-
