  text: 'Image 1 is the man''s character model sheet; image 2 is the woman''s character model sheet; image 3 is a real photo of a YouBike 2.0 shared bicycle; image 4 is the approved art style (sculpted matte clay figurines placed in a painted storybook set). Golden late afternoon on the Yonghe riverside bike path along a low levee by the wide Xindian River: the man and the woman each ride their own YouBike 2.0 shared bicycle (white frame, yellow fenders and chain guard, front basket, like image 3) in SINGLE FILE, one in front of the other on the narrow path: he rides in front, she follows a short distance behind him, smiling at his back, her hair blowing in the wind. Seen from the side as they ride past; tall grass in the foreground; across the river the Taipei skyline with Taipei 101 small in the distance. Every character is a dimensional sculpted matte clay figurine exactly like the people in the art-style image, about four heads tall, adult, never a flat 2D drawing; mouths closed in small
    gentle smiles. the man keeps EXACTLY his model-sheet look: black rectangular glasses, short swept black hair, navy cotton overshirt worn open over a white crewneck T-shirt, khaki chinos, white canvas sneakers, black backpack; the woman keeps EXACTLY her model-sheet look: half-up princess-style wavy dark-brown hair with twisted strands at the back, oatmeal knit sweater, sage-green pleated midi skirt, white low sneakers, small tan leather crossbody bag. Recreate any real place in the same warm matte clay and gouache storybook style. Cinematic composition. Any signs, plaques or screens are blank; no readable text and no logos. No other people. No photorealism, no glossy plastic.'
