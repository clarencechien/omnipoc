  text: 'Reference images, in order: image 1 shows the exact first frame of this shot: begin the video from this image and keep its composition, characters, lighting and clay storybook style; image 2 shows the exact LAST frame of this shot: end the video exactly on this image; image 3 shows the woman''s FACE reference sheet: copy this face exactly (eye size and catchlights, nose, cheeks, mouth); image 4 shows the man''s FACE reference sheet: copy this face exactly (eye size and catchlights, nose, cheeks, mouth); image 5 shows the location, lighting and art direction for this scene: match this place; image 6 shows the approved art style: sculpted matte clay figurines placed in a painted storybook set. The woman is about four heads tall with half-up princess-style wavy dark-brown hair, rounded blushing cheeks and a small gentle smile. The man is about four heads tall with black rectangular glasses, short swept black hair, rounded cheeks and a small gentle smile. Animated 3D storybook short
    film in the approved style of The Playbill: the couple are about four heads tall, adult, rendered as sculpted matte clay figurines with painted gouache texture and fine fabric grain and rounded dimensional hands, placed inside painted storybook versions of real places in Taipei, New Taipei and Yunlin, warm soft golden lighting, gentle cinematic camera, 24fps. Keep faces, glasses, hairstyles and outfits identical to the references in every frame. The characters do not talk: mouths stay closed in small gentle smiles unless they laugh softly. No readable text, signs, captions or logos anywhere in the frame; any sign or plaque is blank. No photorealism, no glossy plastic. Faces are rigid sculpted figurine faces: keep eye size, the white catchlights in the eyes, the small button nose and the round blushing cheeks identical to the face reference sheets in every frame; never shrink the eyes into small dots. Colors are soft and natural like a warm storybook, never oversaturated; skies are gentle,
    not electric blue. Camera moves are simple and slow. A gentle sunny afternoon back at Four Four South Village, soft warm light and a pale soft-blue sky, colors muted and warm, never oversaturated. The couple in their registration-day outfits hold their marriage certificate up together, its front facing the camera, she holds her bouquet in her other hand; they smile at the camera, then lean their heads together and both burst into a happy laugh with their eyes squeezed shut into curved crescents, and they HOLD that eyes-closed laugh until the very last frame; neither of them opens their eyes again. Locked-off camera, no camera movement. The certificate keeps the same simple illustration on top and faint plain lines below, with no letters. Audio: only ambient sound — birds, a light breeze, distant city. No dialogue, no speech, no singing, no music.'
