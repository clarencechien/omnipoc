  text: Image 1 is the first frame of this shot; images 2 and 3 are the woman's and the man's FACE reference sheets; image 4 is the art style. Draw the SAME scene a few seconds later, with EXACTLY the same camera framing, background, house, Taipei 101, sky, light and colors as image 1, the same outfits, bouquet and certificate. Now the couple lean their heads together, touching lightly, and both laugh happily with their eyes squeezed shut into curved happy crescents, mouths in soft open smiles; he still wears his thick black rectangular glasses; their cheeks are round and blushing like the face sheets. They still hold the certificate up together with its front facing the camera, and she still holds her bouquet. The certificate shows only its simple illustration on the top half and a few faint plain lines on the bottom half, with no letters or characters at all. Same muted warm palette as image 1, never oversaturated. Sculpted matte clay figurines. No other people, no readable text, no photorealism.
