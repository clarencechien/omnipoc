- id: w01-bridge
  duration: 15
  text: 'Reference images, in order: image 1 shows the location, lighting and art direction for this scene: match this place; image 2 shows the approved art style: sculpted matte clay figurines placed in a painted storybook set. Animated 3D storybook short film in the approved style of The Playbill: the couple are about four heads tall, adult, rendered as sculpted matte clay figurines with painted gouache texture and fine fabric grain and rounded dimensional hands, placed inside painted storybook versions of real places in Taipei, New Taipei and Yunlin, warm soft golden lighting, gentle cinematic camera, 24fps. Keep faces, glasses, hairstyles and outfits identical to the references in every frame. The characters do not talk: mouths stay closed in small gentle smiles unless they laugh softly. No readable text, signs, captions or logos anywhere in the frame; any sign or plaque is blank. No photorealism, no glossy plastic. Faces are rigid sculpted figurine faces: keep eye size, the white catchlights
    in the eyes, the small button nose and the round blushing cheeks identical to the face reference sheets in every frame; never shrink the eyes into small dots. Colors are soft and natural like a warm storybook, never oversaturated; skies are gentle, not electric blue. Camera moves are simple and slow. [0-9s] Aerial drone shot at sunrise of the long river bridge from the location reference, light traffic moving slowly across it, golden early light and thin mist over the wide river; the drone glides forward and gently descends. [9-15s] The camera tilts down from the bridge deck to the calm river surface, where the bridge, the pink sky and the rising sun are mirrored, soft ripples breaking the reflection. Slow, smooth, one continuous shot. Audio: only ambient sound — soft morning wind, distant traffic hum, water lapping. No dialogue, no speech, no singing, no music.'
