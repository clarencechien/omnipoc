  text: 'Image 1 is a real photo of New Taipei Bridge: a cable-stayed bridge with ONE tall white pylon and fanned cables over a wide river with riverside parks. Image 2 is the approved art style. Recreate the bridge from image 1, with its single tall pylon and fanned cables, as a wide establishing landscape at sunrise in exactly the warm matte clay and gouache storybook style of image 2: pink and gold sky, low sun, thin mist over the wide Dahan River, the bridge and sky mirrored on the calm water, light traffic on the deck, green riverside park in the foreground. Cinematic 16:9. No characters, no text, no signs, no photorealism.'
