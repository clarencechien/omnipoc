- id: he-sheet
  aspect: '16:9'
  size: 1K
  refs:
  - refs/wedding/source/playbill-couple-4heads.png
  text: 'The reference image shows an approved adult storybook couple. Use ONLY the man on the left: black rectangular glasses, short swept black hair, rounded cheeks with soft blush, small gentle closed-mouth smile. Create a character turnaround model sheet of this SAME man with identical face, glasses, hair and proportions (about four heads tall, adult, not a child). Three full-body views side by side at the same scale, feet on one ground line: front view, three-quarter view, back view. Casual everyday outfit instead of the suit: navy cotton overshirt worn open over a white crewneck T-shirt, khaki chinos, white canvas sneakers, a black backpack on one shoulder (visible in the back view). Warm matte sculpted clay with painted gouache texture and fine fabric grain, rounded dimensional hands and shoes. Plain warm ivory background with soft contact shadows. No text, no labels, no numbers, no extra people, no photorealism, no glossy plastic.'
