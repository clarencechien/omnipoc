  text: 'The reference image shows an approved adult storybook couple. Use ONLY the woman on the right: half-up princess-style wavy dark-brown hair with twisted strands gathered at the back and loose lower waves, rounded cheeks with soft blush, small gentle closed-mouth smile. Create a character turnaround model sheet of this SAME woman with identical face, hair and proportions (about four heads tall, adult, not a child). Three full-body views side by side at the same scale, feet on one ground line: front view, three-quarter view, back view; the back view clearly shows the twisted half-up princess hairstyle. Casual everyday outfit instead of the wedding dress: oatmeal knit sweater, sage-green pleated midi skirt, white low sneakers, small tan leather crossbody bag. Warm matte sculpted clay with painted gouache texture and fine fabric grain, rounded dimensional hands and shoes. Plain warm ivory background with soft contact shadows. No text, no labels, no numbers, no extra people, no photorealism,
    no glossy plastic.'
